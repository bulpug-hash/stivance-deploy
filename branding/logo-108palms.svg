<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" role="img" aria-label="108 Palms Beach Resort">
  <defs>
    <linearGradient id="goldShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e6c889" />
      <stop offset="45%" stop-color="#c6a378" />
      <stop offset="100%" stop-color="#9c7d54" />
    </linearGradient>
    <linearGradient id="goldThin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d8b685" />
      <stop offset="100%" stop-color="#a8895f" />
    </linearGradient>
  </defs>

  <g transform="translate(300 88)" fill="url(#goldShine)" stroke="none">
    <!-- left palm frond -->
    <g transform="translate(-122 -4) rotate(-18)">
      <path d="M0 0 C-32 -6 -60 -22 -86 -42 C-66 -28 -42 -22 -18 -22 C-32 -36 -42 -54 -50 -74 C-32 -58 -16 -42 0 -28 C-12 -50 -16 -76 -16 -100 C-2 -76 8 -52 14 -28 C20 -52 30 -76 44 -94 C40 -68 30 -44 16 -22 C40 -28 60 -42 76 -60 C58 -32 36 -10 6 4 Z" />
      <path d="M0 0 C8 0 14 2 18 6 C12 6 6 4 0 2 Z" opacity="0.55" />
    </g>
    <!-- right palm frond -->
    <g transform="translate(122 -4) rotate(18) scale(-1 1)">
      <path d="M0 0 C-32 -6 -60 -22 -86 -42 C-66 -28 -42 -22 -18 -22 C-32 -36 -42 -54 -50 -74 C-32 -58 -16 -42 0 -28 C-12 -50 -16 -76 -16 -100 C-2 -76 8 -52 14 -28 C20 -52 30 -76 44 -94 C40 -68 30 -44 16 -22 C40 -28 60 -42 76 -60 C58 -32 36 -10 6 4 Z" />
      <path d="M0 0 C8 0 14 2 18 6 C12 6 6 4 0 2 Z" opacity="0.55" />
    </g>
  </g>

  <!-- "108" numerals -->
  <g fill="url(#goldShine)" font-family="'Cormorant Garamond', 'Playfair Display', 'Times New Roman', serif" font-weight="500">
    <text x="300" y="120" text-anchor="middle" font-size="78" letter-spacing="6">108</text>
  </g>

  <!-- thin gold separator line -->
  <line x1="200" y1="148" x2="400" y2="148" stroke="url(#goldThin)" stroke-width="0.9" opacity="0.85" />

  <!-- main wordmark -->
  <text x="300" y="178" text-anchor="middle"
        font-family="'Cormorant Garamond', 'Playfair Display', 'Times New Roman', serif"
        font-size="26" letter-spacing="9" fill="#0b2530" font-weight="500">108 PALMS BEACH RESORT</text>

  <!-- tagline -->
  <text x="300" y="210" text-anchor="middle"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="11" letter-spacing="6" fill="#a8895f" font-weight="400">LUXURY BOUTIQUE HOSPITALITY</text>
</svg>
